<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1b2e">
  <title>−18 или +18?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Rubik:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <img id="bg-top" src="assets/bg/hallway-top.png" alt="">
      <img id="bg" src="assets/bg/hallway.jpg" alt="">
      <div id="queue"></div>
    </div>

    <div id="hud">
      <div class="pill" id="progress"></div>
      <div class="pill" id="score">✓ 0</div>
    </div>

    <div id="bubble" aria-live="polite"><span id="bubble-text"></span></div>
    <div id="verdict"></div>
    <div id="hint"></div>

    <div id="controls">
      <button id="btn-minus" class="btn btn-minus" type="button" disabled>−18</button>
      <button id="btn-plus" class="btn btn-plus" type="button" disabled>+18</button>
    </div>

    <section id="screen-start" class="screen">
      <div class="card">
        <h1 id="start-title"></h1>
        <p id="start-intro"></p>
        <button id="btn-start" class="btn btn-big" type="button" disabled>Загрузка…</button>
      </div>
    </section>

    <section id="screen-end" class="screen hidden">
      <div id="confetti"></div>
      <div class="card">
        <h1 id="end-title"></h1>
        <p class="result" id="result"></p>
        <p id="rating"></p>
        <button id="btn-again" class="btn btn-big" type="button"></button>
      </div>
    </section>

    <div id="rotate">Поверни телефон вертикально</div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
